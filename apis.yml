aid: transfercar
name: Transfercar
description: >-
  Transfercar is a free vehicle relocation marketplace that connects rental
  car and motorhome companies who need vehicles moved between their depots
  with travelers willing to drive those vehicles one-way. Rental operators
  list relocation deals for cars and campervans that need to be repositioned,
  and drivers book them to travel between cities at little or no rental cost,
  often with extras such as free days, fuel allowances, or ferry contributions.
  The service operates across New Zealand, Australia, and the United States as
  a consumer-facing web booking platform rather than a developer API provider.
  Transfercar was surfaced as a portfolio company of 500 Global and added to
  the API Evangelist network; this profile has been enriched from its public
  web surface.
